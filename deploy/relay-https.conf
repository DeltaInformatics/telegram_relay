server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.jetourtools.com;
    ssl_certificate /etc/letsencrypt/live/relay.jetourtools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.jetourtools.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_RELAY:10m;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    # Avoid logging Telegram bot tokens from request URLs on upstream errors.
    error_log /var/log/nginx/relay-error.log crit;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    client_max_body_size 55m;
    client_body_timeout 130s;
    location / {
        set $telegram_relay http://telegram-relay:8000;
        proxy_pass $telegram_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        send_timeout 130s;
        proxy_next_upstream off;
    }
}
