services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_API_KEY: ${RELAY_API_KEY:?Set RELAY_API_KEY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 135s
